version: "3.8"

services:
  # Backend Node.js Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MONGODB_URI: ${MONGODB_URI}
      PYTHON_SERVICE_URL: http://python:8000
      NODE_ENV: development
    depends_on:
      - python
    networks:
      - ai-network
    volumes:
      - ./server:/app

  # Python Code Execution Service
  python:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: ai-python
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB (optional - if using local)
  # mongo:
  #   image: mongo:latest
  #   container_name: ai-mongo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo-data:/data/db
  #   networks:
  #     - ai-network

networks:
  ai-network:
    driver: bridge

